name: Windows validation package
run-name: Windows x64 validation — ${{ inputs.source_ref }}
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Fork branch name or full 40-character commit SHA to validate'
        required: true
        type: string
permissions:
  contents: read
env:
  AVALONIA_TELEMETRY_OPTOUT: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
jobs:
  windows:
    name: Tests and NativeAOT Windows x64 package
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Resolve requested branch or full commit SHA
        id: requested
        shell: pwsh
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ref = $env:SOURCE_REF
          if ($ref -match '^[0-9a-fA-F]{40}$') {
            $sha = $ref.ToLowerInvariant()
          } else {
            git check-ref-format "refs/heads/$ref"
            if ($LASTEXITCODE -ne 0) { throw 'Input must be a branch name or full commit SHA' }
            $remote = @(git ls-remote --exit-code "https://github.com/$env:SOURCE_REPOSITORY.git" "refs/heads/$ref")
            if ($LASTEXITCODE -ne 0 -or $remote.Count -ne 1) { throw 'Branch not found or ambiguous' }
            $sha = ($remote[0] -split '\s+')[0]
          }
          if ($sha -notmatch '^[0-9a-f]{40}$') { throw 'Invalid resolved SHA' }
          "sha=$sha" >> $env:GITHUB_OUTPUT
      - name: Checkout selected immutable source
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.requested.outputs.sha }}
          submodules: recursive
          persist-credentials: false
      - name: Record actual source commit
        id: source
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ steps.requested.outputs.sha }}
        run: |
          $sha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $sha -ne $env:EXPECTED_SHA) { throw 'Source SHA mismatch' }
          "sha=$sha" >> $env:GITHUB_OUTPUT
          "short=$($sha.Substring(0,8))" >> $env:GITHUB_OUTPUT
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build app for actual-editor tests when present
        shell: pwsh
        run: |
          if (Test-Path tests/SelectedCommitSquash/SelectedCommitSquash.csproj) {
            dotnet build src/SourceGit.csproj -c Debug
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Run all present feature regression harnesses
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $names = @('SelectedCommitChanges', 'CompactFolders', 'ChangeViewModeMenu', 'SelectedCommitSquash', 'SelectedCommitSquashUI', 'CommitMessageToolTip')
          $results = @()
          foreach ($name in $names) {
            $project = "tests/$name/$name.csproj"
            if (!(Test-Path $project)) {
              $results += "${name}: NOT PRESENT (not tested)"
              Write-Warning "$project not present on selected source; not tested"
              continue
            }
            if ($name -eq 'SelectedCommitSquash') {
              $env:SOURCEGIT_TEST_APP = Join-Path $env:GITHUB_WORKSPACE 'src/bin/Debug/net10.0/SourceGit.dll'
              if (!(Test-Path $env:SOURCEGIT_TEST_APP)) { throw 'Actual app editor DLL missing' }
            }
            dotnet run --project $project -c Debug
            if ($LASTEXITCODE -ne 0) { throw "$name failed with exit code $LASTEXITCODE" }
            $results += "${name}: PASSED"
          }
          $results | Set-Content test-results.txt
          $results | Out-File $env:GITHUB_STEP_SUMMARY -Append
      - name: Verify source formatting
        run: dotnet format --verify-no-changes src/SourceGit.csproj
      - name: Build Release
        run: dotnet build -c Release
      - name: Publish upstream NativeAOT Windows x64 Release
        run: dotnet publish src/SourceGit.csproj -c Release -o build/SourceGit -r win-x64
      - name: Package using selected source upstream script
        shell: pwsh
        env:
          RUNTIME: win-x64
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:VERSION = (Get-Content VERSION -Raw).Trim() + '-validation-' + $env:SOURCE_SHA.Substring(0,8)
          ./build/scripts/package.win.ps1
      - name: Verify exact upstream five-file ZIP, CRC, and SHA256
        shell: python
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          REQUESTED_SOURCE_REF: ${{ inputs.source_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          import hashlib, os, pathlib, zipfile
          expected = {'av_libglesv2.dll', 'libHarfBuzzSharp.dll', 'libonigwrap.dll', 'libSkiaSharp.dll', 'SourceGit.exe'}
          root = pathlib.Path('build/SourceGit')
          actual = {p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file()}
          if actual != expected:
              raise RuntimeError(f'Unexpected native package files: {sorted(actual)}')
          archives = list(pathlib.Path('build').glob('sourcegit_*.zip'))
          if len(archives) != 1:
              raise RuntimeError(f'Expected one ZIP, got {len(archives)}')
          archive = archives[0]
          lines = [f"Requested source: {os.environ['REQUESTED_SOURCE_REF']}", f"Source commit: {os.environ['SOURCE_SHA']}", f"Workflow commit: {os.environ['WORKFLOW_SHA']}", 'Runtime: win-x64; Configuration: Release; NativeAOT', 'Packaging: upstream build/scripts/package.win.ps1', '']
          with zipfile.ZipFile(archive) as z:
              entries = [e for e in z.infolist() if not e.is_dir()]
              if len(entries) != 5 or {e.filename for e in entries} != {'SourceGit/' + n for n in expected}:
                  raise RuntimeError('ZIP layout differs from exact upstream five-file layout')
              if z.testzip() is not None:
                  raise RuntimeError('ZIP CRC validation failed')
              for entry in entries:
                  data = z.read(entry)
                  if data != (root / entry.filename.removeprefix('SourceGit/')).read_bytes():
                      raise RuntimeError('ZIP contents differ from published output')
                  lines.append(f'{entry.filename}  {entry.file_size} bytes  CRC32={entry.CRC:08x}  SHA256={hashlib.sha256(data).hexdigest()}')
          lines += ['', 'ZIP CRC: PASSED', f'ZIP SHA256: {hashlib.sha256(archive.read_bytes()).hexdigest()}', '', pathlib.Path('test-results.txt').read_text()]
          manifest = '\n'.join(lines) + '\n'
          pathlib.Path('build/validation-manifest.txt').write_text(manifest)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(manifest)
          print(manifest)
      - name: Upload upstream-format package and manifest
        uses: actions/upload-artifact@v7
        with:
          name: package.win-x64.${{ steps.source.outputs.short }}
          path: |
            build/sourcegit_*.zip
            build/validation-manifest.txt
          if-no-files-found: error
